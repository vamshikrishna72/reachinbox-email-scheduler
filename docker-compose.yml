version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: reachinbox_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: reachinbox
      MYSQL_USER: reachinbox
      MYSQL_PASSWORD: reachinboxpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: reachinbox_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: reachinbox_backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: "mysql://reachinbox:reachinboxpassword@mysql:3306/reachinbox"
      JWT_SECRET: "reachinbox_super_secret_jwt_key_2026_production"
      REDIS_HOST: "redis"
      REDIS_PORT: 6379
      NODE_ENV: "production"
    depends_on:
      - mysql
      - redis

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: reachinbox_frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:5000/api"
    depends_on:
      - backend

volumes:
  mysql_data:
